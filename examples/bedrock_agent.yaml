metadata:
  name: "bedrock-claude-agent"
  description: "AI agent using AWS Bedrock Claude"
  version: "1.0.0"
  owner: "Cloud Team"
  tags:
    - "aws"
    - "bedrock"
    - "claude"

agent_type: "react"

model:
  provider: "aws_bedrock"
  name: "claude-3-5-sonnet-20241022"
  credentials_key: "AWS_ACCESS_KEY_ID"  # AWS credentials
  region: "us-east-1"
  parameters:
    temperature: 0.7
    max_tokens: 2000

memory:
  type: "conversation_buffer_window"
  config:
    k: 5

tools:
  - name: "query_database"
    description: "Query AWS RDS database"
    type: "function"
    module: "src.tools.aws_rds"
    function: "query_database"
    parameters:
      - name: "query"
        type: "string"
        description: "SQL query"
        required: true
      - name: "database"
        type: "string"
        description: "Database name"
        required: false
        default: "main"

  - name: "invoke_lambda"
    description: "Invoke AWS Lambda function"
    type: "api"
    endpoint: "https://lambda.us-east-1.amazonaws.com/2015-03-31/functions/${LAMBDA_FUNCTION_NAME}/invocations"
    method: "POST"
    headers:
      Authorization: "AWS4-HMAC-SHA256 ${AWS_SIGNATURE}"
      Content-Type: "application/json"
    parameters:
      - name: "payload"
        type: "string"
        description: "JSON payload for Lambda function"
        required: true

knowledge:
  provider: "milvus"
  credentials_key: "MILVUS_TOKEN"
  collection_name: "enterprise-knowledge"
  embedding_model: "text-embedding-ada-002"
  search_config:
    top_k: 5
    score_threshold: 0.8

prompt:
  system_prompt: |
    You are an enterprise AI assistant powered by AWS Bedrock Claude.
    You have access to AWS services including RDS databases and Lambda functions.
    
    Your role is to:
    1. Help with data analysis and queries
    2. Invoke serverless functions when needed
    3. Provide insights based on enterprise knowledge base
    
    Always follow security best practices and validate inputs before processing.
  
  react_template: |
    Answer the following questions as best you can. You have access to the following tools:
    
    {tools}
    
    Use the following format:
    
    Question: the input question you must answer
    Thought: you should always think about what to do
    Action: the action to take, should be one of [{tool_names}]
    Action Input: the input to the action
    Observation: the result of the action
    ... (this Thought/Action/Action Input/Observation can repeat N times)
    Thought: I now know the final answer
    Final Answer: the final answer to the original input question
    
    Begin!
    
    Question: {input}
    Thought: {agent_scratchpad} 