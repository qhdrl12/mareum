metadata:
  name: "customer-support-agent"
  description: "AI agent for customer support automation"
  version: "1.0.0"
  owner: "Support Team"
  tags:
    - "customer-support"
    - "automation"
    - "react"

agent_type: "react"

model:
  provider: "openai"
  name: "gpt-4"
  credentials_key: "OPENAI_API_KEY"
  parameters:
    temperature: 0.7
    max_tokens: 2000
    top_p: 1.0

memory:
  type: "conversation_buffer_window"
  config:
    k: 5

tools:
  - name: "search_knowledge_base"
    description: "Search the company knowledge base for information"
    type: "api"
    endpoint: "https://api.company.com/kb/search"
    method: "POST"
    headers:
      Authorization: "Bearer ${KB_API_TOKEN}"
      Content-Type: "application/json"
    parameters:
      - name: "query"
        type: "string"
        description: "Search query"
        required: true
      - name: "limit"
        type: "integer"
        description: "Maximum number of results"
        required: false
        default: 5

  - name: "create_ticket"
    description: "Create a support ticket"
    type: "api"
    endpoint: "https://api.company.com/tickets"
    method: "POST"
    headers:
      Authorization: "Bearer ${TICKET_API_TOKEN}"
      Content-Type: "application/json"
    parameters:
      - name: "title"
        type: "string"
        description: "Ticket title"
        required: true
      - name: "description"
        type: "string"
        description: "Ticket description"
        required: true
      - name: "priority"
        type: "string"
        description: "Ticket priority (low, medium, high)"
        required: false
        default: "medium"

  - name: "get_user_info"
    description: "Get user information from CRM"
    type: "function"
    module: "src.tools.crm"
    function: "get_user_info"
    parameters:
      - name: "user_id"
        type: "string"
        description: "User ID"
        required: true

knowledge:
  provider: "faiss"
  collection_name: "customer-support-kb"
  embedding_model: "text-embedding-ada-002"
  search_config:
    top_k: 5
    score_threshold: 0.7

prompt:
  system_prompt: |
    You are a helpful customer support AI assistant. Your role is to:
    
    1. Help customers with their questions and issues
    2. Search the knowledge base for relevant information
    3. Create support tickets when necessary
    4. Provide accurate and helpful responses
    
    Always be polite, professional, and helpful. If you cannot solve an issue,
    escalate it by creating a support ticket.
    
    Use the available tools to:
    - Search the knowledge base for information
    - Look up user information when needed
    - Create tickets for complex issues
    
    Remember to think step by step and explain your reasoning.
  
  react_template: |
    Answer the following questions as best you can. You have access to the following tools:
    
    {tools}
    
    Use the following format:
    
    Question: the input question you must answer
    Thought: you should always think about what to do
    Action: the action to take, should be one of [{tool_names}]
    Action Input: the input to the action
    Observation: the result of the action
    ... (this Thought/Action/Action Input/Observation can repeat N times)
    Thought: I now know the final answer
    Final Answer: the final answer to the original input question
    
    Begin!
    
    Question: {input}
    Thought: {agent_scratchpad} 