# OpenAI Agent Configuration
metadata:
  name: "openai-agent"
  description: "AI agent using OpenAI API"
  version: "1.0.0"
  tags:
    - "openai"
    - "cloud-deployment"
    - "gpt-4o-mini"

model:
  provider: "openai"
  name: "o4-mini"
  api_key: "OPENAI_API_KEY"
  parameters:
    temperature: 1
    max_completion_tokens: 2048

prompt:
  system_prompt: |
    You are a helpful AI assistant powered by OpenAI's GPT-4o-mini model.
    You have access to various tools and capabilities.
    
    Always be helpful and provide accurate information based on the available tools.

# Tools configuration will be enhanced later
tools: []

memory:
  type: "simple_buffer"
  config:
    k: 5