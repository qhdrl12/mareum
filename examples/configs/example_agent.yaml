# Example ReAct Agent Configuration - Simplified Tool Integration
metadata:
  name: "example-react-agent"
  version: "1.0.0"
  owner: "langgraph-team"
  description: "Example ReAct agent with simplified tool integration"
  tags: ["example", "react", "tools", "mcp", "simplified"]

agent_type: "react"

model:
  provider: "openai"
  name: "gpt-4"
  api_key: "OPENAI_API_KEY"
  parameters:
    temperature: 0.7
    max_tokens: 2000

memory:
  type: "simple_buffer"
  config:
    k: 10

# Ultra-simplified Tool Configuration - Two types: builtin and mcp
tools:
  # Built-in LangChain BaseTool implementations
  - type: "builtin"
    name: "calculator"
  
  - type: "builtin"
    name: "web_search"
  
  - type: "builtin"
    name: "file_manager"

  # MCP tools via streamable_http (just name + URL!)
  - type: "mcp"
    name: "weather"
    url: "http://weather-service:8000/mcp"

  - type: "mcp"
    name: "math_tools"
    url: "http://math-service:8000/mcp"

  - type: "mcp"
    name: "file_service"
    url: "http://file-tools:8000/mcp"
    timeout: 45

knowledge:
  provider: "faiss"
  collection_name: "agent_knowledge"
  embedding_model: "text-embedding-ada-002"
  search_config:
    top_k: 5
    score_threshold: 0.7

prompt:
  system_prompt: |
    You are a helpful AI assistant with access to various tools.
    
    Available tools:
    - Built-in tools: calculator, web search, file management
    - Weather services via MCP (all available tools)
    - Math tools via MCP (all available tools)
    - File operations via MCP (all available tools)
    
    Use these tools intelligently to answer questions and solve problems.
    Always explain your reasoning and the steps you take.