# ReAct Agent Configuration Example (YAML)
# This file demonstrates a valid configuration that passes schema validation

metadata:
  name: "customer-support-agent"
  version: "1.2.0"
  description: "AI agent for handling customer support inquiries"
  tags:
    - "customer-service"
    - "support"
    - "chatbot"

model:
  provider: "openai"
  name: "gpt-4"
  api_key: "OPENAI_API_KEY"
  base_url: "https://api.openai.com/v1"
  parameters:
    temperature: 0.7
    max_tokens: 1500

prompt:
  system_prompt: |
    You are a helpful customer support agent. You should:
    1. Be polite and professional
    2. Provide accurate information
    3. Ask clarifying questions when needed
    4. Escalate complex issues appropriately

# Tools configuration will be enhanced later
tools: []

memory:
  type: "simple_buffer"
  config:
    k: 20

knowledge:
  provider: "faiss"
  collection_name: "support-knowledge-base"
  embedding_model: "text-embedding-ada-002"
  search_config:
    top_k: 3
    score_threshold: 0.8

 