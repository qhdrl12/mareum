metadata:
  name: "vllm-agent"
  description: "AI agent using vLLM with OpenAI-compatible API"
  version: "1.0.0"
  owner: "Development Team"
  tags:
    - "vllm"
    - "local-deployment"

agent_type: "react"

model:
  provider: "openai_compatible"
  name: "llama-2-7b-chat"
  credentials_key: "VLLM_API_KEY"  # Can be empty for local deployment
  base_url: "http://localhost:8000/v1"  # vLLM server endpoint
  parameters:
    temperature: 0.7
    max_tokens: 1000

memory:
  type: "conversation_buffer_window"
  config:
    k: 5

tools:
  - name: "search_documents"
    description: "Search through local documents"
    type: "function"
    module: "src.tools.local_search"
    function: "search_documents"
    parameters:
      - name: "query"
        type: "string"
        description: "Search query"
        required: true

knowledge:
  provider: "faiss"
  collection_name: "local-documents"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  search_config:
    top_k: 3
    score_threshold: 0.6

prompt:
  system_prompt: |
    You are a helpful AI assistant running on a local vLLM deployment.
    You have access to local document search capabilities.
    
    Always be helpful and provide accurate information based on the available tools.
  
  react_template: |
    Answer the following questions as best you can. You have access to the following tools:
    
    {tools}
    
    Use the following format:
    
    Question: the input question you must answer
    Thought: you should always think about what to do
    Action: the action to take, should be one of [{tool_names}]
    Action Input: the input to the action
    Observation: the result of the action
    ... (this Thought/Action/Action Input/Observation can repeat N times)
    Thought: I now know the final answer
    Final Answer: the final answer to the original input question
    
    Begin!
    
    Question: {input}
    Thought: {agent_scratchpad} 