[pytest]
minversion = 6.0
addopts = -ra -q --strict-markers --strict-config
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (slower, may require external resources)
    api: marks tests as API endpoint tests
    slow: marks tests as slow running tests (>5 seconds)
    mcp: marks tests as MCP server tests
    performance: marks tests as performance and load tests
    smoke: marks tests as basic smoke tests for CI/CD
    regression: marks tests as regression tests for bug fixes
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest_asyncio.plugin.PytestDeprecationWarning 